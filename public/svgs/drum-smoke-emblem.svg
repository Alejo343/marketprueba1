<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Drum Smoke Premium Spirits Logo">
  <defs>
    <linearGradient id="wood1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#140800"/>
      <stop offset="30%" stop-color="#5C3318"/>
      <stop offset="50%" stop-color="#7A4420"/>
      <stop offset="70%" stop-color="#5C3318"/>
      <stop offset="100%" stop-color="#140800"/>
    </linearGradient>
  </defs>

  <circle cx="160" cy="160" r="158" fill="#080808"/>
  <circle cx="160" cy="160" r="155" fill="none" stroke="#C9A84C" stroke-width="3"/>
  <circle cx="160" cy="160" r="148" fill="none" stroke="#C9A84C" stroke-width="0.7" opacity="0.4"/>

  <!-- Smoke wisps -->
  <path d="M147,115 Q137,96 146,76 Q153,59 141,43"
        fill="none" stroke="#9A9A9A" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <path d="M160,111 Q149,88 161,66 Q172,47 158,29"
        fill="none" stroke="#B0B0B0" stroke-width="5.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M173,115 Q184,96 174,76 Q165,59 178,43"
        fill="none" stroke="#9A9A9A" stroke-width="4" stroke-linecap="round" opacity="0.45"/>

  <!-- Barrel body -->
  <path d="M115,118 C100,140 100,180 115,200 L205,200 C220,180 220,140 205,118 Z"
        fill="url(#wood1)"/>

  <!-- Barrel top rim -->
  <ellipse cx="160" cy="118" rx="45" ry="11" fill="#221008" stroke="#C9A84C" stroke-width="2.5"/>

  <!-- Wood grain -->
  <line x1="139" y1="123" x2="135" y2="195" stroke="#3D1C08" stroke-width="1.2" opacity="0.45"/>
  <line x1="160" y1="119" x2="160" y2="200" stroke="#3D1C08" stroke-width="0.8" opacity="0.3"/>
  <line x1="181" y1="123" x2="185" y2="195" stroke="#3D1C08" stroke-width="1.2" opacity="0.45"/>

  <!-- Gold hoops -->
  <ellipse cx="160" cy="133" rx="49" ry="10.5" fill="none" stroke="#C9A84C" stroke-width="5"/>
  <ellipse cx="160" cy="159" rx="55" ry="12" fill="none" stroke="#C9A84C" stroke-width="6.5"/>
  <ellipse cx="160" cy="185" rx="49" ry="10.5" fill="none" stroke="#C9A84C" stroke-width="5"/>

  <!-- Barrel bottom rim -->
  <ellipse cx="160" cy="200" rx="45" ry="11" fill="#0D0500" stroke="#C9A84C" stroke-width="2.5"/>

  <!-- Separator -->
  <line x1="85" y1="215" x2="235" y2="215" stroke="#C9A84C" stroke-width="0.7" opacity="0.45"/>

  <!-- Brand name -->
  <text x="160" y="243"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="24" font-weight="bold"
        fill="#C9A84C" text-anchor="middle" letter-spacing="6">DRUM SMOKE</text>

  <!-- Diamond ornament + flanking lines -->
  <line x1="76" y1="256" x2="126" y2="256" stroke="#C9A84C" stroke-width="0.9" opacity="0.6"/>
  <path d="M160,251 L164,255 L160,259 L156,255 Z" fill="#C9A84C" opacity="0.75"/>
  <line x1="194" y1="256" x2="244" y2="256" stroke="#C9A84C" stroke-width="0.9" opacity="0.6"/>

  <!-- Tagline -->
  <text x="160" y="276"
        font-family="Arial, Helvetica, sans-serif"
        font-size="8.5"
        fill="#9A8C7A" text-anchor="middle" letter-spacing="4.5">PREMIUM SPIRITS</text>
</svg>
