<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" aria-label="Drum Smoke Icon">
  <defs>
    <linearGradient id="wood3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#100600"/>
      <stop offset="30%" stop-color="#4A2810"/>
      <stop offset="50%" stop-color="#6B3818"/>
      <stop offset="70%" stop-color="#4A2810"/>
      <stop offset="100%" stop-color="#100600"/>
    </linearGradient>
  </defs>

  <rect width="200" height="240" fill="#080808" rx="8"/>

  <!-- Dramatic smoke wisps -->
  <path d="M80,93 Q60,68 75,43 Q88,21 65,8"
        fill="none" stroke="#8A8A8A" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <path d="M100,88 Q80,58 100,33 Q118,10 95,3"
        fill="none" stroke="#9A9A9A" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <path d="M120,93 Q140,68 125,43 Q112,21 135,8"
        fill="none" stroke="#8A8A8A" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

  <!-- Barrel body -->
  <path d="M52,96 C36,120 36,170 52,194 L148,194 C164,170 164,120 148,96 Z"
        fill="url(#wood3)"/>

  <!-- Barrel top rim -->
  <ellipse cx="100" cy="96" rx="48" ry="12" fill="#1E0C04" stroke="#C9A84C" stroke-width="2.5"/>

  <!-- Wood grain -->
  <line x1="76" y1="102" x2="71" y2="189" stroke="#3D1A06" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="97" x2="100" y2="194" stroke="#3D1A06" stroke-width="1" opacity="0.3"/>
  <line x1="124" y1="102" x2="129" y2="189" stroke="#3D1A06" stroke-width="1.5" opacity="0.4"/>

  <!-- Gold hoops -->
  <ellipse cx="100" cy="114" rx="52" ry="11.5" fill="none" stroke="#C9A84C" stroke-width="5.5"/>
  <ellipse cx="100" cy="145" rx="59" ry="13" fill="none" stroke="#C9A84C" stroke-width="7"/>
  <ellipse cx="100" cy="176" rx="52" ry="11.5" fill="none" stroke="#C9A84C" stroke-width="5.5"/>

  <!-- Barrel bottom rim -->
  <ellipse cx="100" cy="194" rx="48" ry="12" fill="#080300" stroke="#C9A84C" stroke-width="2.5"/>

  <!-- Divider -->
  <line x1="30" y1="210" x2="170" y2="210" stroke="#C9A84C" stroke-width="0.7" opacity="0.4"/>

  <!-- Brand text -->
  <text x="100" y="228"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" font-weight="bold"
        fill="#C9A84C" text-anchor="middle" letter-spacing="5">DRUM SMOKE</text>
</svg>
