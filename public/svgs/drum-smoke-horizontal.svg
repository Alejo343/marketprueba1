<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 170" width="440" height="170" role="img" aria-label="Drum Smoke Horizontal Logo">
  <defs>
    <linearGradient id="wood2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#140800"/>
      <stop offset="30%" stop-color="#5C3318"/>
      <stop offset="50%" stop-color="#7A4420"/>
      <stop offset="70%" stop-color="#5C3318"/>
      <stop offset="100%" stop-color="#140800"/>
    </linearGradient>
  </defs>

  <rect width="440" height="170" fill="#0D0D0D" rx="4"/>

  <!-- Smoke wisps -->
  <path d="M59,70 Q50,52 58,36 Q65,22 54,28"
        fill="none" stroke="#999" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M70,66 Q61,46 71,29 Q80,15 67,21"
        fill="none" stroke="#AAA" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M81,70 Q90,52 82,36 Q75,22 86,28"
        fill="none" stroke="#999" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Barrel body -->
  <path d="M43,74 C32,92 32,124 43,142 L97,142 C108,124 108,92 97,74 Z" fill="url(#wood2)"/>

  <!-- Barrel top rim -->
  <ellipse cx="70" cy="74" rx="27" ry="7" fill="#221008" stroke="#C9A84C" stroke-width="1.8"/>

  <!-- Wood grain -->
  <line x1="56" y1="79" x2="53" y2="137" stroke="#3D1C08" stroke-width="0.8" opacity="0.4"/>
  <line x1="70" y1="75" x2="70" y2="142" stroke="#3D1C08" stroke-width="0.6" opacity="0.3"/>
  <line x1="84" y1="79" x2="87" y2="137" stroke="#3D1C08" stroke-width="0.8" opacity="0.4"/>

  <!-- Gold hoops -->
  <ellipse cx="70" cy="87" rx="30" ry="7.5" fill="none" stroke="#C9A84C" stroke-width="4"/>
  <ellipse cx="70" cy="108" rx="34" ry="9" fill="none" stroke="#C9A84C" stroke-width="5"/>
  <ellipse cx="70" cy="129" rx="30" ry="7.5" fill="none" stroke="#C9A84C" stroke-width="4"/>

  <!-- Barrel bottom rim -->
  <ellipse cx="70" cy="142" rx="27" ry="7" fill="#0D0500" stroke="#C9A84C" stroke-width="1.8"/>

  <!-- Vertical gold divider -->
  <line x1="130" y1="22" x2="130" y2="148" stroke="#C9A84C" stroke-width="1" opacity="0.45"/>

  <!-- DRUM — large gold serif -->
  <text x="152" y="105"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="60" font-weight="bold"
        fill="#C9A84C" letter-spacing="2">DRUM</text>

  <!-- SMOKE — secondary, cream -->
  <text x="157" y="140"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="38" font-weight="bold"
        fill="#F5F0E8" letter-spacing="9">SMOKE</text>

  <!-- Tagline -->
  <text x="157" y="160"
        font-family="Arial, Helvetica, sans-serif"
        font-size="8"
        fill="#9A8C7A" letter-spacing="4">PREMIUM SPIRITS &amp; AGED LIQUORS</text>
</svg>
